<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mine projekter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ====== Skift til dit GitHub-brugernavn ====== */
  /* (Bruges kun hvis siden ikke ligger på brugernavn.github.io) */

  :root {
    --paper: #EEF1EE;
    --ink: #1C2A26;
    --muted: #5E6B66;
    --line: #C9D1CC;
    --accent: #2B5D8A;
    --row-hover: #E3E8E4;
    --glow: rgba(43, 93, 138, .08);
    --grid: rgba(28, 42, 38, .07);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #151C1A;
      --ink: #E4EAE6;
      --muted: #94A39D;
      --line: #2E3A36;
      --accent: #7FB0DB;
      --row-hover: #1D2623;
      --glow: rgba(127, 176, 219, .09);
      --grid: rgba(228, 234, 230, .06);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #151C1A;
    --ink: #E4EAE6;
    --muted: #94A39D;
    --line: #2E3A36;
    --accent: #7FB0DB;
    --row-hover: #1D2623;
    --glow: rgba(127, 176, 219, .09);
    --grid: rgba(228, 234, 230, .06);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--paper);
    /* Svagt lys fra toppen + fint prikgitter som millimeterpapir */
    background-image:
      radial-gradient(ellipse 90% 55% at 50% -10%, var(--glow), transparent 70%),
      radial-gradient(circle, var(--grid) 1px, transparent 1.3px);
    background-size: 100% 100%, 24px 24px;
    background-attachment: fixed;
    color: var(--ink);
    font: 400 1.0625rem/1.55 "Schibsted Grotesk", system-ui, sans-serif;
  }
  main { position: relative; z-index: 1; max-width: 52rem; margin: 0 auto; padding: 4rem 1.5rem 6rem; }
  #waves { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  header { display: flex; gap: 1.5rem; align-items: flex-end; margin-bottom: 3rem; }
  header img { width: 88px; height: 88px; border-radius: 50%; border: 2px solid var(--line); }
  h1 {
    font-weight: 900; font-size: clamp(2.4rem, 7vw, 4.2rem);
    line-height: .95; letter-spacing: -.03em; margin: 0;
  }
  .bio { color: var(--muted); margin: .5rem 0 0; max-width: 60ch; }

  .tools { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1rem; }
  input, select {
    font: inherit; color: var(--ink); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; padding: .5rem .75rem;
  }
  input { flex: 1 1 14rem; }
  select, option { background: var(--paper); color: var(--ink); }
  .theme-toggle {
    position: fixed; top: 1rem; right: 1rem; z-index: 10;
    width: 2.5rem; height: 2.5rem; display: grid; place-items: center;
    color: var(--muted); background: transparent; cursor: pointer;
    border: 0; border-radius: 50%; padding: 0;
  }
  .theme-toggle:hover { color: var(--ink); background: var(--row-hover); }
  .theme-toggle svg { width: 1.25rem; height: 1.25rem; }
  .fork { font-size: .8125rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 .35rem; }
  input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .count { color: var(--muted); font-size: .9375rem; margin: 0 0 .5rem; }

  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { border-bottom: 1px solid var(--line); }
  li a {
    display: grid; grid-template-columns: 1fr auto; gap: .25rem 1.5rem;
    padding: 1.1rem .5rem; color: inherit; text-decoration: none;
  }
  li a:hover { background: var(--row-hover); }
  .name { font-weight: 700; font-size: 1.25rem; color: var(--accent); }
  .desc { grid-column: 1; color: var(--muted); margin: 0; }
  .meta {
    grid-column: 2; grid-row: 1 / span 2; align-self: center;
    display: flex; gap: 1rem; color: var(--muted); font-size: .9375rem; white-space: nowrap;
  }
  .lang::before {
    content: ""; display: inline-block; width: .6rem; height: .6rem;
    border-radius: 50%; background: var(--dot, var(--muted)); margin-right: .4rem;
  }
  .status { padding: 2rem 0; color: var(--muted); }

  @media (max-width: 600px) {
    header { flex-direction: column; align-items: flex-start; }
    li a { grid-template-columns: 1fr; }
    .meta { grid-column: 1; grid-row: auto; }
  }
</style>
</head>
<body>
<canvas id="waves" aria-hidden="true"></canvas>
<button id="theme" class="theme-toggle" type="button"></button>
<main>
  <header>
    <img id="avatar" alt="" hidden>
    <div>
      <h1 id="title">Projekter</h1>
      <p class="bio" id="bio"></p>
    </div>
  </header>

  <div class="tools">
    <input id="search" type="search" placeholder="Søg i projekter" aria-label="Søg i projekter">
    <select id="lang" aria-label="Filtrér på sprog"><option value="">Alle sprog</option></select>
  </div>
  <p class="count" id="count"></p>
  <ul id="list"><li class="status">Henter projekter…</li></ul>
</main>

<script>
  // Skriv dit brugernavn her. Ligger siden på brugernavn.github.io, findes det automatisk.
  const FALLBACK_USER = "DIT-BRUGERNAVN";
  const SHOW_FORKS = true;

  const host = location.hostname;
  const USER = host.endsWith(".github.io") ? host.split(".")[0] : FALLBACK_USER;

  const langColors = {
    JavaScript: "#E3C628", TypeScript: "#3178C6", Python: "#3572A5", HTML: "#E34C26",
    CSS: "#663399", "C#": "#178600", Java: "#B07219", Go: "#00ADD8", Rust: "#DEA584",
    PHP: "#4F5D95", Shell: "#89E051", Ruby: "#701516", Kotlin: "#A97BFF", Swift: "#F05138"
  };

  const $ = id => document.getElementById(id);
  let repos = [];

  async function load() {
    try {
      const [userRes, repoRes] = await Promise.all([
        fetch(`https://api.github.com/users/${USER}`),
        fetch(`https://api.github.com/users/${USER}/repos?per_page=100&sort=pushed`)
      ]);
      if (repoRes.status === 403) throw new Error("GitHub har midlertidigt begrænset antallet af opslag. Prøv igen om en time.");
      if (!repoRes.ok) throw new Error(`Kunne ikke finde brugeren "${USER}". Tjek brugernavnet i index.html.`);

      const user = await userRes.json();
      $("title").textContent = user.name || user.login;
      document.title = `${user.name || user.login} – projekter`;
      if (user.bio) $("bio").textContent = user.bio;
      if (user.avatar_url) { $("avatar").src = user.avatar_url; $("avatar").hidden = false; }

      repos = (await repoRes.json()).filter(r => !r.private && (SHOW_FORKS || !r.fork));
      const langs = [...new Set(repos.map(r => r.language).filter(Boolean))].sort();
      langs.forEach(l => $("lang").add(new Option(l, l)));
      render();
    } catch (err) {
      $("list").innerHTML = "";
      const li = document.createElement("li");
      li.className = "status";
      li.textContent = err.message;
      $("list").append(li);
    }
  }

  function render() {
    const q = $("search").value.trim().toLowerCase();
    const lang = $("lang").value;
    const shown = repos.filter(r =>
      (!lang || r.language === lang) &&
      (!q || r.name.toLowerCase().includes(q) || (r.description || "").toLowerCase().includes(q))
    );

    $("count").textContent = `${shown.length} af ${repos.length} projekter`;
    const list = $("list");
    list.innerHTML = "";
    if (!shown.length) {
      list.innerHTML = '<li class="status">Ingen projekter matcher. Prøv en anden søgning.</li>';
      return;
    }
    for (const r of shown) {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = r.homepage || r.html_url;
      a.innerHTML = `
        <span class="name"></span>
        <p class="desc"></p>
        <span class="meta">
          ${r.fork ? `<span class="fork">Fork</span>` : ""}
          ${r.language ? `<span class="lang" style="--dot:${langColors[r.language] || "var(--muted)"}"></span>` : ""}
          ${r.stargazers_count ? `<span>★ ${r.stargazers_count}</span>` : ""}
          <span>${new Date(r.pushed_at).toLocaleDateString("da-DK", { month: "short", year: "numeric" })}</span>
        </span>`;
      a.querySelector(".name").textContent = r.name;
      a.querySelector(".desc").textContent = r.description || "Ingen beskrivelse";
      if (r.language) a.querySelector(".lang").textContent = r.language;
      li.append(a);
      list.append(li);
    }
  }

  // Lys/mørk tilstand: starter med systemets indstilling, knappen skifter manuelt
  const root = document.documentElement;
  const systemDark = matchMedia("(prefers-color-scheme: dark)");
  const currentTheme = () => root.dataset.theme || (systemDark.matches ? "dark" : "light");
  const sunIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`;
  const moonIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>`;
  const updateToggle = () => {
    const dark = currentTheme() === "dark";
    $("theme").innerHTML = dark ? sunIcon : moonIcon;
    $("theme").setAttribute("aria-label", dark ? "Skift til lys tilstand" : "Skift til mørk tilstand");
  };
  $("theme").addEventListener("click", () => {
    root.dataset.theme = currentTheme() === "dark" ? "light" : "dark";
    updateToggle();
    refreshWaveColor();
  });
  systemDark.addEventListener("change", () => { updateToggle(); refreshWaveColor(); });
  updateToggle();

  // Baggrundsanimation: en git-graf der langsomt glider opad.
  // Grene opstår, får commits og merges tilbage, ligesom historikken i dine repos.
  const canvas = $("waves");
  const ctx = canvas.getContext("2d");
  const LANE_GAP = 46;       // afstand mellem grene (px)
  const ROW_H = 30;          // afstand mellem commits (px)
  const SPEED = 0.012;       // px pr. millisekund – lavere = roligere
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w = 0, h = 0, slots = 0, offset = 0, last = 0;
  let rows = [], active = [], colors = {}, alpha = 0.2, slotX = [], slotSide = [];
  const COLUMN_GAP = 32;     // luft mellem grafen og listen (px)

  function refreshWaveColor() {
    const css = getComputedStyle(root);
    colors = {
      a: css.getPropertyValue("--accent").trim(),
      b: css.getPropertyValue("--muted").trim(),
      paper: css.getPropertyValue("--paper").trim()
    };
    alpha = currentTheme() === "dark" ? 0.26 : 0.24;
    if (reduceMotion) draw();
  }

  const laneColor = s => (s % 3 === 1 ? colors.b : colors.a);

  // Laver næste række i grafen ud fra hvilke grene der er aktive nu
  function nextRow() {
    const next = new Set(), edges = [], dots = new Set();
    const isActive = new Set(active);
    const fill = active.length / slots;
    const pBranch = fill < 0.25 ? 0.12 : fill > 0.55 ? 0.01 : 0.04;
    const pMerge = fill > 0.55 ? 0.12 : fill < 0.25 ? 0.005 : 0.03;
    const merged = new Set();

    for (const s of active) {
      const n = s + (Math.random() < 0.5 ? -1 : 1);
      const sameSide = n >= 0 && n < slots && slotSide[n] === slotSide[s]; // grene krydser aldrig listen
      if (Math.random() < pMerge && sameSide && isActive.has(n) && !merged.has(n)) {
        edges.push([s, n]); merged.add(s); dots.add(n); continue;
      }
      edges.push([s, s]); next.add(s);
      if (Math.random() < pBranch && sameSide && !isActive.has(n) && !next.has(n)) {
        edges.push([s, n]); next.add(n); dots.add(s);
      }
      if (Math.random() < 0.3) dots.add(s);
    }
    // Sørg for at begge sider har mindst én gren
    for (const sd of [0, 1]) {
      const own = slotX.map((_, i) => i).filter(i => slotSide[i] === sd);
      if (own.length && !own.some(i => next.has(i) && !merged.has(i))) {
        next.add(own[Math.floor(Math.random() * own.length)]);
      }
    }
    active = [...next].filter(s => !merged.has(s)).sort((x, y) => x - y);
    return { edges, dots };
  }

  // Grene placeres kun i margenerne til venstre og højre for listen
  function reset() {
    const main = document.querySelector("main");
    const r = main.getBoundingClientRect();
    const cs = getComputedStyle(main);
    const colLeft = r.left + parseFloat(cs.paddingLeft) - COLUMN_GAP;
    const colRight = r.right - parseFloat(cs.paddingRight) + COLUMN_GAP;
    const left = [], right = [];
    for (let x = colLeft; x >= 12; x -= LANE_GAP) left.unshift(x);
    for (let x = colRight; x <= w - 64; x += LANE_GAP) right.push(x); // fri plads til sol/måne-ikonet
    slotX = [...left, ...right];
    slotSide = [...left.map(() => 0), ...right.map(() => 1)];
    slots = slotX.length;
    active = [];
    rows = [];
    if (!slots) return;                     // smal skærm: ingen plads i siderne
    for (let s = 0; s < slots; s++) if (Math.random() < 0.35) active.push(s);
    const needed = Math.ceil(h / ROW_H) + 3;
    for (let i = 0; i < needed; i++) rows.push(nextRow());
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    reset();
    if (reduceMotion) draw();
  }

  function draw() {
    const x = s => slotX[s];
    ctx.clearRect(0, 0, w, h);
    if (!slots) return;
    ctx.globalAlpha = alpha;
    ctx.lineWidth = 1.5;

    rows.forEach((row, i) => {
      const y1 = i * ROW_H - offset, y2 = y1 + ROW_H;
      for (const [from, to] of row.edges) {
        ctx.strokeStyle = laneColor(from === to ? from : Math.max(from, to));
        ctx.beginPath();
        ctx.moveTo(x(from), y1);
        if (from === to) ctx.lineTo(x(to), y2);
        else ctx.bezierCurveTo(x(from), y1 + ROW_H * 0.6, x(to), y2 - ROW_H * 0.6, x(to), y2);
        ctx.stroke();
      }
    });

    rows.forEach((row, i) => {
      const y = i * ROW_H - offset;
      for (const s of row.dots) {
        ctx.beginPath();
        ctx.arc(x(s), y, 3.5, 0, Math.PI * 2);
        ctx.globalAlpha = 1;
        ctx.fillStyle = colors.paper;   // dækker stregen bag prikken
        ctx.fill();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = laneColor(s);
        ctx.stroke();
      }
    });
  }

  function loop(time) {
    const dt = last ? Math.min(time - last, 50) : 16;
    last = time;
    offset += dt * SPEED;
    while (offset >= ROW_H) { offset -= ROW_H; if (slots) { rows.shift(); rows.push(nextRow()); } }
    draw();
    requestAnimationFrame(loop);
  }

  addEventListener("resize", resize);
  refreshWaveColor();
  resize();
  if (!reduceMotion) requestAnimationFrame(loop);

  $("search").addEventListener("input", render);
  $("lang").addEventListener("change", render);
  load();
</script>
</body>
</html>
